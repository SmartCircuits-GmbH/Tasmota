; ***  WattWächter Build Environments  ***

; *** WattWächter Wifi/USB (ESP8266, 1M Flash) - SML Smartmeter Lesekopf
;     OTA_URL wird in user_config_override.h gesetzt (siehe dort).
[env:wattwaechter_wifi_usb]
board                       = esp8266_1M
build_flags                 = ${env.build_flags}
                              -DWATTWAECHTER_WIFI_USB

; *** WattWächter Wi-Fi / USB Gen2 (ESP32-C6-Mini, 8M Flash) - SML Smartmeter Lesekopf
[env:wattwaechter_esp32c6]
extends                     = env:tasmota32_base
board                       = esp32c6_8M
build_flags                 = ${env:tasmota32_base.build_flags}
                              -DWATTWAECHTER_ESP32C6
                              -DCONFIG_NIMBLE_CPP_IDF
lib_extra_dirs              = ${env:tasmota32_base.lib_extra_dirs}
                              lib/libesp32_div
lib_ignore                  = ${env:tasmota32_base.lib_ignore}
                              Micro-RTSP

; *** WattWächter Wi-Fi / USB Gen2 Safeboot (Recovery firmware, written to safeboot partition)
;     Build first:   platformio run -e wattwaechter_esp32c6_safeboot
;     Then build:    platformio run -e wattwaechter_esp32c6
;     The combined firmware.factory.bin then contains OUR safeboot.
[env:wattwaechter_esp32c6_safeboot]
extends                     = env:tasmota32_base
board                       = esp32c6_8M
board_build.app_partition_name = safeboot
build_flags                 = ${env:tasmota32_base.build_flags}
                              -DWATTWAECHTER_ESP32C6
                              -DFIRMWARE_SAFEBOOT
lib_extra_dirs              = lib/lib_ssl, lib/libesp32
lib_ignore                  = ${safeboot_flags.lib_ignore}
custom_sdkconfig            =
                              '# CONFIG_ULP_COPROC_ENABLED is not set'
                              '# CONFIG_IEEE802154_ENABLED is not set'
                              '# CONFIG_ESP_GDBSTUB_ENABLED is not set'
                              '# CONFIG_BT_ENABLED is not set'
                              '# CONFIG_BT_NIMBLE_ENABLED is not set'
                              '# CONFIG_BT_CONTROLLER_ENABLED is not set'
                              CONFIG_BT_CONTROLLER_DISABLED=y
                              '# CONFIG_LWIP_IP_FORWARD is not set'
                              '# CONFIG_LWIP_IPV4_NAPT is not set'
                              '# CONFIG_LWIP_IPV4_NAPT_PORTMAP is not set'
                              '# CONFIG_LWIP_PPP_SUPPORT is not set'
                              '# CONFIG_ETH_SPI_ETHERNET_DM9051 is not set'
                              '# CONFIG_ETH_SPI_ETHERNET_KSZ8851SNL is not set'
custom_component_remove     = ${safeboot_flags.custom_component_remove}
